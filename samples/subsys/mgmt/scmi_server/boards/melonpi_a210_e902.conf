CONFIG_SCMI_SERVER_CLOCK=y
CONFIG_SCMI_SERVER_RESET=y
CONFIG_RESET=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE=y
CONFIG_SCMI_SERVER_POWER=y
CONFIG_SENSOR=y
CONFIG_SCMI_SERVER_SENSOR=y
CONFIG_SCMI_SERVER_SYSTEM_POWER=y
# Measured peaks on Melon Pi: 1024 bytes main, 32 bytes interrupt stack,
# from reset through Linux runtime, DVFS and power-domain tests.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
