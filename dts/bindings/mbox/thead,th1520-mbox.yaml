# SPDX-License-Identifier: Apache-2.0
description: |
  XuanTie AON mailbox interface shared by TH1520 and A210 E902 AON processors.
  rx is the local interrupt block; tx is the remote AP data channel.
compatible: "thead,th1520-mbox"
include: [base.yaml, mailbox-controller.yaml]
properties:
  reg:
    required: true
  reg-names:
    required: true
  rx-channel:
    type: int
    required: true
    enum: [0, 1, 2, 3]
    description: Receive status bit assigned to the peer in the local IRQ block
  zhihe,channel-info:
    type: boolean
    description: |
      Provide two transmit channels sharing the peer doorbell. Each doorbell
      first sets INFO<channel> in the tx block; the receiver clears it.
  "#mbox-cells":
    const: 1
mbox-cells:
  - channel
